<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETM Whiteboard">
<title>ETM Whiteboard</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#e4f3fa;--panel:#fff;--ink:#1d2433;--line:#d5dbe5;--paper:#fff;--grid:#cfe0f5;--accent:#2f6fed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){.bar{background:var(--panel)!important}:root{--bg:#12161d;--panel:#1c222d;--ink:#e8ecf3;--line:#333c4b;--paper:#fbfbf8;--grid:#c5d6ec}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;background:linear-gradient(90deg,#fff4d8,var(--panel) 45%,#d9f0fb);border-bottom:1px solid var(--line)}
.grp{display:flex;gap:6px;align-items:center}
.sep{width:1px;height:28px;background:var(--line)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel));font-weight:700}
.sw{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.dot{display:inline-block;border-radius:50%;background:currentColor;vertical-align:middle}
#who{margin-left:auto;font-size:14px;padding:6px 10px;border-radius:99px;border:1.5px solid var(--line)}
#who.live{border-color:#1f9d55;color:#1f9d55;font-weight:700}
.stage{flex:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center}
.paper{position:relative;background-color:var(--paper);border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none;--u:1px}
.paper.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:calc(40*var(--u)) calc(40*var(--u))}
.paper.lines{background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% calc(50*var(--u))}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#b{pointer-events:none}#pt{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(229,56,75,.55);border:3px solid #e5384b;display:none;pointer-events:none;box-shadow:0 0 14px #e5384b}
#sym{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:6px;z-index:4;flex-wrap:wrap;justify-content:center;max-width:94%;background:var(--panel);padding:6px;border-radius:12px;border:1px solid var(--line)}
#brand{font-weight:700;font-size:15px}
#wp{z-index:8!important}#wb{display:grid;gap:10px;grid-template-columns:1fr 1fr}#wb button{font-size:20px;padding:16px;font-weight:700}
#gp,#sp,#wp{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:6;padding:12px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:96vw;max-height:96vh;overflow:auto;text-align:center}
.gh{display:flex;gap:8px;justify-content:center;margin:8px 0}
#gsc{font-size:20px;font-weight:700;margin-top:4px}
#gst{margin:8px 0;font-weight:700;font-size:18px}
#gbd{display:grid;gap:6px;justify-content:center;background:var(--line);padding:6px;border-radius:12px}
#gbd button{width:var(--cs);height:var(--cs);padding:0;font-size:calc(var(--cs)*.6);line-height:1;border-radius:10px;min-height:0;background:var(--panel)}
#gbd.c4 button{border-radius:50%}
#pgl{font-size:14px;min-width:70px;text-align:center}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a93a3;font-size:22px;pointer-events:none;text-align:center;padding:20px}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:380px;width:100%}
#gate h1{margin:0 0 8px;font-size:24px}
#gate p{margin:0 0 16px;color:#7b8598}
#gate input{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px}
#gate button{width:100%}#scp button{margin-top:8px}#gate #tip{margin:12px 0 0;color:var(--ink);font-size:14px}
#gate #go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div id="gate"><div class="card">
  <h1>ETM Whiteboard</h1>
  <p>Enter your private room code. Anyone with the same code draws on the same board.</p>
  <input id="code" placeholder="Room code, e.g. maths42" autocomplete="off" aria-label="Room code" maxlength="30">
  <button id="go">Join room</button>
  <button id="back" style="margin-top:8px;display:none">Cancel</button>
  <button id="sc" style="margin-top:8px">Get a shortcut</button>
  <div id="scp" style="display:none"><button id="scpi">Raspberry Pi</button><button id="scfire">Fire tablet</button><button id="scip">iPhone</button><p id="tip"></p></div>
</div></div>
<div class="bar" role="toolbar" aria-label="Whiteboard tools">
  <div id="brand"><b style="color:#e5384b">Emily</b>, <b style="color:#2f6fed">Tommy</b> &amp; <b style="color:#1f9d55">Matthew</b>'s Whiteboard</div>
  <div class="grp" id="colors" role="group" aria-label="Pen colour"></div>
  <div class="sep"></div>
  <div class="grp">
    <button id="pen" aria-pressed="true">Pen</button>
    <button id="eraser" aria-pressed="false">Eraser</button>
    <button id="line" aria-pressed="false">Line</button>
    <button id="text" aria-pressed="false">Text</button>
    <button id="stamp" aria-pressed="false">Sticker</button>
    <button id="ptr" aria-pressed="false">Pointer</button>
  </div>
  <div class="grp" id="sizes" role="group" aria-label="Thickness"></div>
  <div class="sep"></div>
  <div class="grp">
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="clear">Clear</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="prev" aria-label="Previous page">‹</button><span id="pgl">Page 1/1</span><button id="next" aria-label="Next page">›</button><button id="addp">+ Page</button>
    <button id="photo">Photo</button>
    <button id="bg">Paper: Blank</button>
    <button id="save">Save picture</button>
    <button id="starsb">Stars ⭐</button>
    <button id="games">Games</button>
    <button id="whoami">Who?</button>
    <button id="mic" aria-pressed="false">Mic off</button>
    <button id="room">Room</button>
  </div>
  <div id="who" role="status">Not connected</div>
</div>
<div id="gp" role="dialog" aria-label="Games"><div class="gc">
  <div class="gh"><button id="g1">Tic tac toe</button><button id="g2">Connect 4</button><button id="g3">Hangman</button></div>
  <div id="gsc"></div><p id="gst"></p><div id="gbd"></div><div id="ghg" style="display:none"></div>
  <div class="gh"><button id="gnew">New game</button><button id="gres">Reset score</button><button id="gx">Close</button></div>
</div></div>
<div id="wp"><div class="gc"><h1 style="margin:0 0 12px;font-size:22px">Who's here?</h1><div id="wb"></div></div></div>
<div id="sp"><div class="gc" id="spc"></div></div>
<input type="file" id="sfile" accept="image/*" hidden>
<input type="file" id="file" accept="image/*" hidden>
<audio id="aud" autoplay></audio>
<div class="stage" id="stage">
  <div class="paper" id="paper">
    <canvas id="b"></canvas>
    <canvas id="c"></canvas>
    <div id="pt"></div>
    <div id="sym"></div>
    <div class="hint" id="hint">Draw here. The other person sees it live.</div>
  </div>
</div>
<script>
(function(){
  var W=1600,H=1000,scale=1;
  var COLORS=[["#1d2433","Black"],["#2f6fed","Blue"],["#e5384b","Red"],["#1f9d55","Green"],["#f08a00","Orange"],["#8e44d6","Purple"]];
  var SIZES=[3,7,14];
  var stage=document.getElementById("stage"),paper=document.getElementById("paper"),cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var me=Math.random().toString(36).slice(2,8),n=0;
  var strokes=[],redo=[],cur=null,color=COLORS[1][0],size=SIZES[1],tool="pen",bgMode=0;
  var BG=["Blank","Grid","Lines","Graph","Number line"];

  function mk(parent,html,fn){var b=document.createElement("button");b.innerHTML=html;b.onclick=fn;parent.appendChild(b);return b}
  var cbox=document.getElementById("colors");
  COLORS.forEach(function(c,i){
    var b=mk(cbox,"",function(){color=c[0];setTool("pen");mark(cbox,b)});
    b.className="sw";b.style.background=c[0];b.title=c[1];b.setAttribute("aria-label",c[1]);
    b.setAttribute("aria-pressed",i===1?"true":"false");
  });
  var sbox=document.getElementById("sizes");
  SIZES.forEach(function(s,i){
    var b=mk(sbox,'<span class="dot" style="width:'+(s+4)+'px;height:'+(s+4)+'px"></span>',function(){size=s;mark(sbox,b)});
    b.setAttribute("aria-label","Thickness "+(i+1));b.setAttribute("aria-pressed",i===1?"true":"false");
  });
  function mark(box,on){[].forEach.call(box.children,function(x){x.setAttribute("aria-pressed",x===on?"true":"false")})}
  var TOOLS=["pen","eraser","line","ptr","text","stamp"];
  function setTool(t){tool=t;TOOLS.forEach(function(k){document.getElementById(k).setAttribute("aria-pressed",k===t)})}
  TOOLS.forEach(function(k){document.getElementById(k).onclick=function(){setTool(k)}});

  var pages=[{bg:0,img:""}],pg=0,bc=document.getElementById("b"),bx=bc.getContext("2d"),mic=null,calls=[],aud=document.getElementById("aud"),ptT=null,lastP=0;
  function drawBg(x,u,p){
    x.setTransform(u,0,0,u,0,0);x.fillStyle="#fff";x.fillRect(0,0,W,H);
    if(p.el&&p.el.complete&&p.el.naturalWidth){var k=Math.min(W/p.el.naturalWidth,H/p.el.naturalHeight),w=p.el.naturalWidth*k,h=p.el.naturalHeight*k;x.drawImage(p.el,(W-w)/2,(H-h)/2,w,h);return}
    var m=p.bg,i;if(!m)return;
    x.strokeStyle="#cfe0f5";x.lineWidth=1.5;x.beginPath();
    if(m===1||m===3){for(i=0;i<=W;i+=40){x.moveTo(i,0);x.lineTo(i,H)}for(i=0;i<=H;i+=40){x.moveTo(0,i);x.lineTo(W,i)}}
    if(m===2){for(i=50;i<=H;i+=50){x.moveTo(0,i);x.lineTo(W,i)}}
    x.stroke();
    x.strokeStyle="#44506a";x.fillStyle="#44506a";x.lineWidth=3;x.beginPath();
    if(m===3){x.moveTo(800,0);x.lineTo(800,H);x.moveTo(0,480);x.lineTo(W,480)}
    if(m===4){x.moveTo(60,500);x.lineTo(W-60,500);x.font="26px sans-serif";x.textAlign="center";
      for(i=0;i<=20;i++){var px=80+i*72;x.moveTo(px,486);x.lineTo(px,514);x.fillText(String(i-10),px,556)}}
    x.stroke();
  }
  function paintBg(){drawBg(bx,bc.width/W,pages[pg])}
  function mkPage(i){while(pages.length<=i)pages.push({bg:0,img:""})}
  function label(){dirty=true;document.getElementById("pgl").textContent="Page "+(pg+1)+"/"+pages.length;
    document.getElementById("bg").textContent="Paper: "+BG[pages[pg].bg];
    document.getElementById("photo").textContent=pages[pg].img?"Remove photo":"Photo"}
  function goPage(i,remote){closeText();mkPage(i);pg=i;label();paintBg();redraw();if(!remote)send("page",{n:i})}
  function setBg(g,m,remote){mkPage(g);pages[g].bg=m;if(g===pg){label();paintBg()}if(!remote)send("bg",{g:g,m:m})}
  function setImg(g,u,remote){mkPage(g);var q=pages[g];q.img=u;
    if(u){q.el=new Image();q.el.onload=function(){if(g===pg)paintBg()};q.el.src=u}else q.el=null;
    if(g===pg){label();paintBg()}if(!remote)send("img",{g:g,u:u})}
  function mergeInfo(a){if(!Array.isArray(a))return;a.forEach(function(q,i){mkPage(i);
    if(q.bg&&!pages[i].bg)pages[i].bg=q.bg;if(q.img&&!pages[i].img)setImg(i,q.img,true)});label();paintBg()}
  function showPtr(d){var e=document.getElementById("pt");e.style.left=d.x*100+"%";e.style.top=d.y*100+"%";e.style.display="block";clearTimeout(ptT);ptT=setTimeout(function(){e.style.display="none"},1500)}
  function sendPtr(e){var t=Date.now();if(t-lastP<40)return;lastP=t;var q=pos(e);send("ptr",{x:q[0]/W,y:q[1]/H})}
  function ans(call){call.answer();call.on("stream",function(st){aud.srcObject=st;var pr=aud.play();if(pr&&pr.catch)pr.catch(function(){})})}
  function callAll(){conns.forEach(function(c){if(mic&&peer)calls.push(peer.call(c.peer,mic))})}
  var game=null,gp=document.getElementById("gp"),sc={you:0,them:0,draws:0,last:""};
  function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function loadScore(){try{var d=JSON.parse(localStorage.getItem("etmScore:"+code)||"null");if(d&&typeof d.you==="number")sc=d}catch(e){}}
  function saveScore(){try{localStorage.setItem("etmScore:"+code,JSON.stringify(sc))}catch(e){}}
  function renderScore(){document.getElementById("gsc").textContent=(pl?pl.n:"You")+" "+sc.you+" – "+sc.them+" "+(other||"Them")+(sc.draws?"  ·  draws "+sc.draws:"")}
  function countGame(){
    var g=game;if(!g||g.win===""||!g.id||g.id===sc.last||!conns.length)return;
    sc.last=g.id;
    if(g.win==="draw")sc.draws++;
    else if(g.k==="hang"){((g.win==="won")===(g.setter!==me))?sc.you++:sc.them++}
    else{g.win===myMark()?sc.you++:sc.them++}
    saveScore();
  }
  function myMark(){return game.opener===me?0:1}
  function newGame(k){game=k==="hang"?{k:"hang",id:gid(),setter:me,stage:"set",word:"",hint:"",g:[],win:""}:{k:k,b:new Array(k==="ttt"?9:42).fill(-1),turn:0,win:"",opener:me,id:gid()};send("game",game);showGame()}
  function gcheck(){
    var b=game.b,t=game.k==="ttt",w=t?3:7,h=t?3:6,L=t?3:4,dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(var y=0;y<h;y++)for(var x=0;x<w;x++){var v=b[y*w+x];if(v<0)continue;
      for(var d=0;d<4;d++){var k=1;while(k<L){var xx=x+dirs[d][0]*k,yy=y+dirs[d][1]*k;if(xx<0||xx>=w||yy<0||yy>=h||b[yy*w+xx]!==v)break;k++}if(k===L)return v}}
    return b.indexOf(-1)<0?"draw":"";
  }
  function play(i){
    if(!game||game.win!==""||(conns.length&&game.turn!==myMark()))return;
    var b=game.b,m=game.turn;
    if(game.k==="ttt"){if(b[i]>=0)return;b[i]=m}
    else{var c=i%7,r;for(r=5;r>=0;r--)if(b[r*7+c]<0)break;if(r<0)return;b[r*7+c]=m}
    game.win=gcheck();game.turn=1-m;send("game",game);showGame();
  }
  function showGame(){
    closeText();var g=game;if(g.k==="hang"){showHang();return}document.getElementById("ghg").style.display="none";document.getElementById("gbd").style.display="";var t=g.k==="ttt",cols=t?3:7,names=t?["X","O"]:["Red","Yellow"],cs=t?["#2f6fed","#e5384b"]:["#e5384b","#f2b705"];
    gp.style.display="flex";countGame();renderScore();
    var st=document.getElementById("gst"),bd=document.getElementById("gbd"),mm=myMark();
    st.textContent=g.win==="draw"?"It's a draw!":g.win!==""?names[g.win]+" wins! 🎉":
      "Turn: "+names[g.turn]+(conns.length?(g.turn===mm?" (you)":" (them)"):"")+(conns.length?" · you are "+names[mm]:"");
    bd.className=t?"":"c4";bd.style.setProperty("--cs",t?"92px":"46px");bd.style.gridTemplateColumns="repeat("+cols+",var(--cs))";
    bd.innerHTML="";
    g.b.forEach(function(v,i){var b=document.createElement("button");
      b.textContent=v<0?"":(t?names[v]:"●");b.style.color=v<0?"":cs[v];
      b.setAttribute("aria-label","Square "+(i+1));b.onclick=function(){play(i)};bd.appendChild(b)});
  }
  function guess(l){
    if(!game||game.k!=="hang"||game.stage!=="play"||game.win!=="")return;
    if(game.setter===me&&conns.length)return;
    game.g=game.g||[];if(game.g.indexOf(l)>=0)return;game.g.push(l);
    var w=game.word,wr=game.g.filter(function(x){return w.indexOf(x)<0}).length;
    game.win=wr>=7?"lost":w.split("").every(function(x){return game.g.indexOf(x)>=0})?"won":"";
    send("game",game);showGame();
  }
  function showHang(){
    closeText();gp.style.display="flex";countGame();renderScore();
    var g=game,box=document.getElementById("ghg"),st=document.getElementById("gst"),M=7;
    document.getElementById("gbd").style.display="none";box.style.display="block";box.innerHTML="";
    var word=String(g.word||"").toLowerCase().replace(/[^a-z]/g,"").slice(0,20),
      gs=(g.g||[]).filter(function(l){return /^[a-z]$/.test(l)}),
      iSet=g.setter===me,alone=!conns.length,
      wrong=gs.filter(function(l){return word.indexOf(l)<0}).length,
      over=g.win==="won"||g.win==="lost",canG=!iSet||alone;
    function el(tag,txt,css){var e=document.createElement(tag);if(txt)e.textContent=txt;if(css)e.style.cssText=css;box.appendChild(e);return e}
    var inCss="font:inherit;font-size:20px;padding:10px;width:240px;max-width:80%;margin:6px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:center";
    if(g.stage==="set"){
      if(!iSet){st.textContent="Waiting for the other person to pick a word…";return}
      st.textContent="Pick a word to spell";
      var wi=el("input","",inCss);wi.placeholder="Secret word";wi.maxLength=20;wi.autocapitalize="off";wi.setAttribute("aria-label","Secret word");
      box.appendChild(document.createElement("br"));
      var hi=el("input","",inCss);hi.placeholder="Clue (optional)";hi.maxLength=60;hi.setAttribute("aria-label","Clue");
      box.appendChild(document.createElement("br"));
      var go=el("button","Start game","margin-top:8px");
      go.onclick=function(){var w=wi.value.toLowerCase().replace(/[^a-z]/g,"");if(w.length<2){wi.focus();return}
        game={k:"hang",id:g.id,setter:me,stage:"play",word:w,hint:hi.value.trim().slice(0,60),g:[],win:""};send("game",game);showGame()};
      wi.focus();return;
    }
    st.textContent=g.win==="won"?"Spelled it! 🎉":g.win==="lost"?"Out of guesses. The word was "+word.toUpperCase():
      (canG?"Guess the word! ":"They're guessing… ")+(M-wrong)+" wrong guesses left";
    var parts=['<circle cx="82" cy="40" r="10"/>','<line x1="82" y1="50" x2="82" y2="85"/>','<line x1="82" y1="58" x2="68" y2="74"/>','<line x1="82" y1="58" x2="96" y2="74"/>','<line x1="82" y1="85" x2="70" y2="108"/>','<line x1="82" y1="85" x2="94" y2="108"/>','<path d="M77 36l4 4m0-4l-4 4m10-4l4 4m0-4l-4 4"/>'];
    el("div").innerHTML='<svg viewBox="0 0 120 130" width="150" height="160" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M15 120h60M35 120V15h47v10"/>'+parts.slice(0,wrong).join("")+'</svg>';
    el("div",word.split("").map(function(l){return (!canG||over||gs.indexOf(l)>=0)?l.toUpperCase():"_"}).join(" "),"font-size:30px;letter-spacing:.15em;font-family:monospace;margin:8px 0;word-break:break-all");
    if(g.hint)el("div","Clue: "+String(g.hint).slice(0,60),"margin-bottom:8px");
    var kb=el("div","","display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:380px;margin:0 auto");
    "abcdefghijklmnopqrstuvwxyz".split("").forEach(function(l){
      var b=document.createElement("button"),used=gs.indexOf(l)>=0;b.textContent=l.toUpperCase();
      b.style.cssText="width:40px;height:40px;min-height:0;padding:0";b.disabled=used||over||!canG;
      if(used)b.style.color=word.indexOf(l)>=0?"#1f9d55":"#e5384b";
      b.onclick=function(){guess(l)};kb.appendChild(b)});
  }
  function hideGame(){game=null;gp.style.display="none"}
  document.getElementById("games").onclick=function(){if(game)showGame();else newGame("ttt")};
  document.getElementById("g1").onclick=function(){newGame("ttt")};
  document.getElementById("g2").onclick=function(){newGame("c4")};
  document.getElementById("g3").onclick=function(){newGame("hang")};
  document.getElementById("gnew").onclick=function(){newGame(game?game.k:"ttt")};
  document.getElementById("gres").onclick=function(){sc.you=sc.them=sc.draws=0;saveScore();renderScore();send("scorereset",{})};

      var i=find(d.id);
      if(i<0){strokes.push({id:d.id,g:d.g,c:d.c,w:d.w,e:d.e,t:d.t,p:[]});i=strokes.length-1}
      strokes[i].p=strokes[i].p.concat(d.p);redraw();

      var j=find(d.id);if(j<0)strokes.push(d);else strokes[j]=d;sortS();redraw();
    }else if(t==="undo"){var k=find(d.id);if(k>=0){strokes.splice(k,1);redraw()}}
    else if(t==="clear"){strokes=strokes.filter(function(s){return s.g!==d.g});redraw()}
    else if(t==="ptr"){showPtr(d)}else if(t==="page"){goPage(d.n,true)}else if(t==="bg"){setBg(d.g,d.m,true)}else if(t==="img"){setImg(d.g,d.u,true)}
    else if(t==="game"){if(d&&((Array.isArray(d.b)&&((d.k==="ttt"&&d.b.length===9)||(d.k==="c4"&&d.b.length===42)))||(d.k==="hang"&&Array.isArray(d.g)&&typeof d.word==="string"))){game=d;showGame()}}

      mergeInfo(d.p);var ch=false;d.s.forEach(function(s){if(find(s.id)<0){strokes.push(s);ch=true}});
      if(ch){sortS();redraw()}
    }
  }
  function addConn(c){
    c.on("open",function(){
      conns.push(c);update();c.send({t:"sync",d:{s:strokes,p:pages.map(function(q){return {bg:q.bg,img:q.img}})}});c.send({t:"page",d:{n:pg}});if(mic)callAll();if(game)c.send({t:"game",d:game});c.send({t:"hello",d:{n:pl?pl.n:""}});
    });
    c.on("data",function(m){
      if(!m||typeof m.t!=="string")return;
      conns.forEach(function(o){if(o!==c&&o.open)o.send(m)}); // host relays between guests
      handle(m.t,m.d);
    });
    function gone(){
      conns=conns.filter(function(x){return x!==c});update();
      if(peer&&!peer.hosting)retry();
    }
    c.on("close",gone);c.on("error",gone);
  }

    });
  }
